server:
  port: 8080

spring:
  application:
    name: agent-platform
  config:
    # 自动加载本地配置（含 API 密钥，已被 .gitignore 忽略）
    import: optional:classpath:application-local.yml

  # H2 内嵌数据库配置（文件模式，持久化到本地）
  datasource:
    url: jdbc:h2:file:./data/agent-platform
    driver-class-name: org.h2.Driver
    username: sa
    password:

  # JPA 配置
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  # Spring AI OpenAI 配置
  ai:
    openai:
      # API 密钥通过环境变量或 application-local.yml 注入，禁止硬编码
      api-key: ${OPENAI_API_KEY:}
      base-url: https://token-plan.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
      chat:
        options:
          model: glm-5.2
          temperature: 0.2

    # Agent Utils 配置
    agent-utils:
      # Skills 加载根目录，默认 classpath:skills，支持 file: 前缀覆盖
      skills-root: classpath:skills
      # 子Agent定义加载根目录，默认 classpath:agents，支持 file: 前缀覆盖
      agents-root: classpath:agents
      # 子Agent执行层限流配置
      subagent:
        # 最大并行度，默认 4
        max-parallelism: 4
        # 单次子Agent执行存活时长，默认 120s
        lifespan: 120s
