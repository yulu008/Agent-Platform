server:
  port: 8080

spring:
  application:
    name: agent-platform
  config:
    # 自动加载本地配置（含 API 密钥，已被 .gitignore 忽略）
    import: optional:classpath:application-local.yml

  # 开发期关闭 Thymeleaf 模板缓存，修改 HTML 后刷新即生效，无需重启
  thymeleaf:
    cache: false

  # H2 内嵌数据库配置（文件模式，持久化到本地）
  datasource:
    url: jdbc:h2:file:./data/agent-platform
    driver-class-name: org.h2.Driver
    username: sa
    password:

  # Spring AI 配置
  ai:
    # Session JDBC 配置
    session:
      time-to-live: 90d
      repository:
        jdbc:
          initialize-schema: always
    openai:
      # API 密钥通过环境变量或 application-local.yml 注入，禁止硬编码
      api-key: ${OPENAI_API_KEY:}
      base-url: https://token-plan.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
      # 请求超时（默认60s，glm-5.2 流式响应可能较慢）
      timeout: 180s
      chat:
        options:
          model: glm-5.2
          temperature: 0.2
          # GLM-5.2 默认 max-tokens=4096，当模型单次生成多个 tool call 时
          # 输出会在中途被截断导致 JSON 不完整。提升到32768  降低截断概率。
          max-tokens: 32768

    # Agent Utils 配置
    agent-utils:
      # Skills 加载根目录，默认 classpath:skills，支持 file: 前缀覆盖
      skills-root: classpath:skills
      # 子Agent定义加载根目录，默认 classpath:agents，支持 file: 前缀覆盖
      agents-root: classpath:agents
      # 子Agent执行层限流配置
      subagent:
        # 最大并行度，默认 4
        max-parallelism: 4
        # 单次子Agent执行存活时长，默认 120s
        lifespan: 120s
