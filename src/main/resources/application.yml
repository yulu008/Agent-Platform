server:
  port: 8080

spring:
  application:
    name: agent-platform
  config:
    # 自动加载本地配置（含 API 密钥，已被 .gitignore 忽略）
    import: optional:classpath:application-local.yml

  # 开发期关闭 Thymeleaf 模板缓存，修改 HTML 后刷新即生效，无需重启
  thymeleaf:
    cache: false

  h2:
    console:
      enabled: true
      path: /h2-console
  # H2 内嵌数据库配置（文件模式，持久化到本地）
  datasource:
    url: jdbc:h2:file:./data/agent-platform
    driver-class-name: org.h2.Driver
    username: sa
    password:

  # Spring AI 配置
  ai:
    # Session JDBC 配置
    session:
      time-to-live: 90d
      repository:
        jdbc:
          initialize-schema: always


    # Agent Utils 配置
    agent-utils:
      # Skills 加载根目录，默认 classpath:skills，支持 file: 前缀覆盖
      skills-root: classpath:skills
      # 子Agent定义加载根目录，默认 classpath:agents，支持 file: 前缀覆盖
      agents-root: classpath:agents
      # 子Agent执行层限流配置
      subagent:
        # 最大并行度，默认 4
        max-parallelism: 4
        # 单次子Agent执行存活时长，默认 120s
        lifespan: 120s

# 多模型配置（完全接管模型装配，排除 Spring AI OpenAI 自动配置）
# 每个模型独立 base-url/api-key/model/max-tokens/timeout，由 ModelConfiguration 装配
agent:
  models:
    glm-5-2:
      base-url: https://open.bigmodel.cn/api/paas/v4
      # 密钥通过环境变量或 application-local.yml 注入，禁止硬编码
      api-key: ${OPENAI_API_KEY:}
      model: glm-5.2
      # GLM-5.2 默认 max-tokens=4096，多 tool call 时输出中途截断致 JSON 不完整，提升到 32768 降低截断概率
      max-tokens: 32768
      timeout: 180s
      temperature: 0.2
      roles: [chat, compaction, title, subagent, workshop]
      default-model: true
    glm-5-1:
      base-url: https://open.bigmodel.cn/api/paas/v4
      api-key: ${OPENAI_API_KEY:}
      model: glm-5.1
      max-tokens: 32768
      timeout: 180s
      temperature: 0.2
      roles: [chat]
      default-model: false
    local:
      base-url: http://127.0.0.1:9081/v1
      api-key: sk-local
      model: qwen3.6-35b
      # 本地 qwen ctx=4096，留 1024 给 prompt+历史，避免撞 ctx 墙
      max-tokens: 3072
      timeout: 300s
      roles: [chat]


  # 租户级 token 计量与配额（tenant-token-metering）——绑定 MeteringProperties（前缀 agent.metering）
  metering:
    # 计量总开关（tasks 9.1）：false 时 MeteringAdvisor 完全旁路（不写库、不计费），一键回滚
    enabled: true
    # 明细 token_usage_log 保留天数（tasks 9.3），超期由 UsageLogCleanupTask 每日清理
    detail-retention-days: 90
    quota:
      # 配额硬拒开关（tasks 9.2）：迁移期默认关（仅计量不拦截），观察数据完整后再开
      enabled: false
      # 平台默认预算（元/账号，tasks 9.3）：滚动窗口内累计消费 >= 预算即硬拒
      default-budget-yuan: 20.0
      # 滚动窗口天数（非自然月）
      window-days: 30
    pricing:
      # 档位单价（元/百万 token；数值上等于 微元/token）。DB(pricing_policy) 覆盖优先，管理端可改即时生效
      flash:
        input-yuan-per-million: 3
        output-yuan-per-million: 10
        cache-yuan-per-million: 2
      standard:
        input-yuan-per-million: 8
        output-yuan-per-million: 24
        cache-yuan-per-million: 2


# 认证与租户（JWT 签发配置；HS256 密钥生产环境必须经环境变量覆盖）
auth:
  jwt:
    secret: ${AUTH_JWT_SECRET:dev-only-secret-change-me-in-production-0123456789abcdef}
    # token 有效期，默认 7 天
    ttl: 7d

# 内容审查（输入侧闸门，input-content-moderation）
# 仅审用户输入、本地敏感词库匹配（脏话/歧视/色情）；命中即整条拒答 + 中止流，被拒输入不落库
moderation:
  # 总开关：false 时闸门整体旁路（一键回滚到无审查旧行为）
  enabled: true
  # 敏感词库资源位置，支持 classpath: 与 file: 前缀（加载失败/空词库等价于无命中放行，不阻断启动）
  wordlist-location: classpath:moderation/sensitive-words.txt
  # 命中拒答时返回给用户的统一话术（不透露具体命中类别）
  refusal-message: 抱歉，您的输入包含不适宜的内容，我无法处理。请调整后重试。

# 天气功能配置（WeatherService 读取）
weather:
  # wttr.in format=j1 查询地址，~lat,lon 指定坐标
  url: https://wttr.in/~31.253,121.397?format=j1
  # 前端展示用地址标签
  location-label: 上海市普陀区清涧路

# RPG 沙盒角色扮演配置
rpg:
  jdbc:
    # 应用启动时自动创建 RPG 专用表（参考 spring.ai.session.jdbc 机制）
    initialize-schema: always
    schema-locations: classpath:rpg/schema-h2.sql
  # 存档级长期记忆（GM 笔记本，落盘 ~/.agent/rpg-saves/<gameStateId>/）
  memory:
    # 每 N 轮由引擎向 GM 追加一次「整理笔记」提醒；<= 0 表示完全关闭（GM 仍可自主写入）
    # 调大→提醒更稀、token 更省但 GM 容易忘记落笔；调小→反之
    remind-every-turns: 5
    # 每 N 轮向 GM 重注入一次「世界背景回顾」（精简世界观 + 笔记本索引）。
    # 世界观只渲染进首轮 system prompt 且不落库，长对话后会漂移；重注入块随 user 消息落库、
    # 旧副本随 30 事件滑窗自然滑出不会累积；<= 0 表示完全关闭
    world-refresh-every-turns: 10

# Actuator 端点：暴露 metrics 供可观测性验证
# /actuator/metrics/gen_ai_client_token_usage_total 查看 token 用量
# /actuator/metrics/gen_ai_client_operation_seconds 查看 LLM 调用耗时
management:
  endpoints:
    web:
      exposure:
        include: metrics,health,info
