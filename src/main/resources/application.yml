server:
  port: 8080

spring:
  application:
    name: agent-platform
  config:
    # 自动加载本地配置（含 API 密钥，已被 .gitignore 忽略）
    import: optional:classpath:application-local.yml

  # 开发期关闭 Thymeleaf 模板缓存，修改 HTML 后刷新即生效，无需重启
  thymeleaf:
    cache: false

  # MultipartFile 尺寸闸：max-file-size 4MB 服务封面上传；request 16MB 容纳
  # planner 资料页满配（planner-html-source：5 份 × 2MB + 表单字段；单份 2MB
  # 语义闸在 PipelineRunController 层校验，封面单文件 4MB 语义不变）
  servlet:
    multipart:
      max-file-size: 4MB
      max-request-size: 16MB

  h2:
    console:
      enabled: true
      path: /h2-console
  # H2 内嵌数据库配置（文件模式，持久化到本地）
  datasource:
    url: jdbc:h2:file:./data/agent-platform
    driver-class-name: org.h2.Driver
    username: sa
    password:

  # Spring AI 配置
  ai:
    # Session JDBC 配置
    session:
      time-to-live: 90d
      repository:
        jdbc:
          initialize-schema: always


    # Agent Utils 配置
    agent-utils:
      # Skills 加载根目录，默认 classpath:skills，支持 file: 前缀覆盖
      skills-root: classpath:skills
      # 子Agent定义加载根目录，默认 classpath:agents，支持 file: 前缀覆盖
      agents-root: classpath:agents
      # 子Agent执行层限流配置
      subagent:
        # 最大并行度，默认 4
        max-parallelism: 4
        # 单次子Agent执行存活时长，默认 120s
        lifespan: 120s

# 多模型配置（完全接管模型装配，排除 Spring AI OpenAI 自动配置）
# 每个模型独立 base-url/api-key/model/max-tokens/timeout，由 ModelConfiguration 装配
# （timeout 语义 = 读空闲超时：流式 token 在流动即不限总时长，见 ModelConfiguration）
agent:
  models:
    glm-5-2:
      base-url: https://open.bigmodel.cn/api/paas/v4
      # 密钥通过环境变量或 application-local.yml 注入，禁止硬编码
      api-key: ${OPENAI_API_KEY:}
      model: glm-5.2
      # GLM-5.2 默认 max-tokens=4096，多 tool call 时输出中途截断致 JSON 不完整，提升到 32768 降低截断概率
      max-tokens: 32768
      # 超时语义为「读空闲超时」（ModelConfiguration 双重覆盖：基础客户端 customizer
      # + ClientOptions.timeout 反射改写——每请求 RequestOptions 覆盖源也同语义）：
      # token 持续流动即不限总时长，仅网络/模型停摆超阈值才断流；180s 对齐
      # 旧 callTimeout 时代实测容忍度，读空闲语义下严格更宽松
      timeout: 180s
      temperature: 0.2
      roles: [chat, compaction, title, subagent, workshop, planner]
      default-model: true
    glm-5-1:
      base-url: https://open.bigmodel.cn/api/paas/v4
      api-key: ${OPENAI_API_KEY:}
      model: glm-5.1
      max-tokens: 32768
      timeout: 180s
      temperature: 0.2
      # roles 加 'judge' 值即把该模型指定为内容评估裁判（content-eval 批跑），如 roles: [chat, judge]
      roles: [chat]
      default-model: false
    local:
      base-url: http://127.0.0.1:9081/v1
      api-key: sk-local
      model: qwen3.6-35b
      # 本地 qwen ctx=4096，留 1024 给 prompt+历史，避免撞 ctx 墙
      max-tokens: 3072
      timeout: 300s
      roles: [chat]


  # 租户级 token 计量与配额（tenant-token-metering）——绑定 MeteringProperties（前缀 agent.metering）
  metering:
    # 计量总开关（tasks 9.1）：false 时 MeteringAdvisor 完全旁路（不写库、不计费），一键回滚
    enabled: true
    # 明细 token_usage_log 保留天数（tasks 9.3），超期由 UsageLogCleanupTask 每日清理
    detail-retention-days: 90
    quota:
      # 配额硬拒开关（tasks 9.2）：迁移期默认关（仅计量不拦截），观察数据完整后再开
      enabled: false
      # 平台默认预算（元/账号，tasks 9.3）：滚动窗口内累计消费 >= 预算即硬拒
      default-budget-yuan: 20.0
      # 滚动窗口天数（非自然月）
      window-days: 30
    pricing:
      # 档位单价（元/百万 token；数值上等于 微元/token）。DB(pricing_policy) 覆盖优先，管理端可改即时生效
      flash:
        input-yuan-per-million: 3
        output-yuan-per-million: 10
        cache-yuan-per-million: 2
      standard:
        input-yuan-per-million: 8
        output-yuan-per-million: 24
        cache-yuan-per-million: 2


# 认证与租户（JWT 签发配置；HS256 密钥生产环境必须经环境变量覆盖）
auth:
  jwt:
    secret: ${AUTH_JWT_SECRET:dev-only-secret-change-me-in-production-0123456789abcdef}
    # token 有效期，默认 7 天
    ttl: 7d

# 内容审查（输入侧闸门，input-content-moderation）
# 仅审用户输入、本地敏感词库匹配（脏话/歧视/色情）；命中即整条拒答 + 中止流，被拒输入不落库
moderation:
  # 总开关：false 时闸门整体旁路（一键回滚到无审查旧行为）
  enabled: true
  # 敏感词库资源位置，支持 classpath: 与 file: 前缀（加载失败/空词库等价于无命中放行，不阻断启动）
  wordlist-location: classpath:moderation/sensitive-words.txt
  # 命中拒答时返回给用户的统一话术（不透露具体命中类别）
  refusal-message: 抱歉，您的输入包含不适宜的内容，我无法处理。请调整后重试。

# 天气功能配置（WeatherService 读取）
weather:
  # wttr.in format=j1 查询地址，~lat,lon 指定坐标
  url: https://wttr.in/~31.253,121.397?format=j1
  # 前端展示用地址标签
  location-label: 上海市普陀区清涧路

# RPG 沙盒角色扮演配置
rpg:
  jdbc:
    # 应用启动时自动创建 RPG 专用表（参考 spring.ai.session.jdbc 机制）
    initialize-schema: always
    schema-locations: classpath:rpg/schema-h2.sql
  # 存档级长期记忆（GM 笔记本，落盘 ~/.agent/rpg-saves/<gameStateId>/）
  memory:
    # 每 N 轮由引擎向 GM 追加一次「整理笔记」提醒；<= 0 表示完全关闭（GM 仍可自主写入）
    # 调大→提醒更稀、token 更省但 GM 容易忘记落笔；调小→反之
    remind-every-turns: 5
    # 每 N 轮向 GM 重注入一次「世界背景回顾」（精简世界观 + 笔记本索引）。
    # 世界观只渲染进首轮 system prompt 且不落库，长对话后会漂移；重注入块随 user 消息落库、
    # 旧副本随 30 事件滑窗自然滑出不会累积；<= 0 表示完全关闭
    world-refresh-every-turns: 10
  # 招式技能树（建档初始发放 + GM 上下文渲染；领悟门禁由 rpg-technique-gate 消费同一组配置）
  technique:
    # 精英档星阶（Gold / Specter-TianGang / GodWarrior）建档时全部根节点的初始熟练度
    # 档位映射见 TechniqueProficiency：200=入门、400=小成、600=大成、800=圆满、1000=究极奥义
    initial-proficiency-elite: 400
    # 新人档星阶（Silver / Bronze / Hidden / Specter-DiSha）确定性抽中那 1 招的初始熟练度
    initial-proficiency-rookie: 200
    # 领悟后继招式所需的前置熟练度阈值；调低→进阶快但树的分层被稀释，调高→每层需多轮打磨
    default-unlock-threshold: 400
  # 设定集（star-lorebook：关键词触发注入 + 名录只读端点）
  lorebook:
    # 总开关（回滚路径）：设为 false 即整体停用——关键词扫描与「设定集·已揭示」注入断流，
    # 名录只读端点返回 503；表与数据保留不动，开局抢星的 runtime 落档不在此开关管辖（存档级不变量）
    enabled: true
  # 策划管线（add-planner-pipeline：多阶段内容生成管线）
  # 工作区真源在 ~/.agent/tenants/<tid>/planner-runs/<runId>/（阶段状态存 manifest.yaml）
  planner:
    # 总开关（回滚路径）：设为 false 即整体停用——管线端点返回 503，表与工作区文件保留不动
    enabled: true
    # ip_name 模式 HTML 资料页数量上限（planner-html-source，scanUrls 时代
    # scan-url-limit 的语义接替；至少 1 份才允许创建）
    max-source-pages: 5
    # ip_name 模式单份 HTML 资料页字节上限（超出 413；long 字段不支持 2MB 带单位写法，2097152 = 2×1024×1024）
    max-page-bytes: 2097152
    # S3 批容量 / S5 候选数量上限（planner-s3-batch-generate：S3 语义从「总上限」转为「每批容量」，
    # 名册按序切块分批生成，总候选数由批数累计不受总上限截断；S5 分支语义不变）
    max-candidates: 20
    # S3 批间并行度（多批 LLM 调用合并单 SSE 流；置 1 即串行回退，配置级回滚路径）
    batch-concurrency: 2
    # ---- S1 text 链式提炼（planner-s1-chained-refinement）----
    # 链式触发阈值（字符数）：≤ 阈值单流直塞（行为零增量），> 阈值走「分块→逐块笔记→汇总」。
    # 调超大值即整体回退单流（配置级回滚路径）
    chain-threshold-chars: 10000
    # 单块字数上限：`#` 章超限章内二次切分、无结构兜底切块的粒度
    chunk-max-chars: 12000
    # text 原文总字数硬上限：创建时超出 400 拒绝（防极端 payload/落盘/moderation 扫描）
    max-source-chars: 500000
    # 汇总轮笔记总量防御上限：超出置 FAILED 报可读错误引导拆 run，不静默截断
    notes-total-max-chars: 100000
  # 内容质量评估（content-eval-character-consistency：人物一致性离线批跑参数，绑定 EvalProperties）
  # 注意：judge 模型选择不在本段——agent.models 任一条目 roles 加 'judge' 值即指定裁判，
  # 未配置条目 = eval 未启用（端点明确报错，不静默 fallback）
  eval:
    # judge 调用并发度（1 = 串行；批跑 judge 成本单路可控）
    judge-concurrency: 1
    # 状态轨迹断崖检测阈值：|Δ| ≥ 该值且该轮叙述无对应关键词命中 → L1 预警
    cliff-threshold: 40
    # 动态层滑窗轮数（早窗/晚窗各取 N 轮，超上下文预算时最近轮优先缩窗）
    dynamic-window-turns: 15

# Actuator 端点：暴露 metrics 供可观测性验证
# /actuator/metrics/gen_ai_client_token_usage_total 查看 token 用量
# /actuator/metrics/gen_ai_client_operation_seconds 查看 LLM 调用耗时
management:
  endpoints:
    web:
      exposure:
        include: metrics,health,info
