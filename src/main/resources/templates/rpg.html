<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>沙盒角色扮演 RPG</title>
    <link rel="stylesheet" th:href="@{/css/rpg.css(v=${#dates.createNow().time})}"/>
</head>
<body>

<!-- ========== 顶部标题栏 ========== -->
<header class="rpg-header">
    <h1><span class="logo-dot"></span>沙盒 RPG</h1>
    <div class="header-info" id="headerInfo" hidden>
        <span id="worldName"></span> | <span id="charName"></span>
    </div>
    <div class="header-actions">
        <button class="header-btn" id="homeNavBtn" title="返回首页" hidden>🏠 首页</button>
        <button class="header-btn" id="workshopNavBtn" title="进入工坊（编辑世界观与角色）">🛠 工坊</button>
        <a href="/" class="header-btn" title="返回平台主页">←</a>
    </div>
</header>

<!-- ========== 首页（唯一落地视图，rpg-home-entry）========== -->
<main class="home-mode" id="homeMode">
    <!-- 新开冒险卡片（进入游戏模式的路径②：世界观 + 玩家角色） -->
    <div class="new-adventure-card" id="newAdventureCard">
        <div class="new-adventure-title">⚔️ 新开冒险</div>
        <div class="new-adventure-form">
            <select id="selectWorld"><option value="">选择世界观...</option></select>
            <select id="selectPlayer"><option value="">选择玩家角色...</option></select>
            <button class="btn-primary" id="confirmStartBtn">确认开始</button>
        </div>
        <div class="new-adventure-hint">没有合适的世界观或角色？先进工坊创作，再回来开局。</div>
    </div>
    <div class="home-count" id="homeSaveCount">共 0 个存档</div>
    <div id="saveList" class="home-grid"></div>
    <div id="saveEmpty" class="save-empty" hidden>暂无存档，从新开冒险开始你的第一次冒险吧</div>
</main>

<!-- ========== 工坊模式 ========== -->
<main class="workshop-mode" id="workshopMode" hidden>
    <div class="workshop-tabs">
        <button class="tab-btn active" data-tab="world">世界观</button>
        <button class="tab-btn" data-tab="character">角色卡</button>
        <button class="tab-btn" data-tab="location">地点</button>
        <button class="tab-btn" data-tab="trigger">触发器</button>
        <button class="tab-btn" data-tab="relationship">关系</button>
    </div>

    <!-- 世界观编辑器 -->
    <section class="tab-content active" id="tab-world">
        <div class="editor-section">
            <h2>世界观设定</h2>
            <div class="form-row">
                <label>已保存世界观</label>
                <select id="worldSelect">
                    <option value="">（新建）</option>
                </select>
            </div>
            <div class="form-row">
                <label>名称</label>
                <input type="text" id="worldNameInput" placeholder="如：钟表城" autocomplete="off"/>
            </div>
            <div class="form-row">
                <label>时代</label>
                <input type="text" id="worldEraInput" placeholder="如：蒸汽朋克时代" autocomplete="off"/>
            </div>
            <div class="form-row">
                <label>描述</label>
                <textarea id="worldDescInput" rows="10" placeholder="世界描述..." autocomplete="off"></textarea>
            </div>
            <div class="form-row">
                <label>规则</label>
                <textarea id="worldRulesInput" rows="10" placeholder='["魔法退化","蒸汽动力"]' autocomplete="off"></textarea>
            </div>
            <div class="form-row">
                <label>氛围</label>
                <input type="text" id="worldAtmosphereInput" placeholder="如：灰暗、机械感" autocomplete="off"/>
            </div>
            <div class="form-actions">
                <button class="btn-secondary" id="newWorldBtn" title="清空表单，准备新建世界观">➕ 新建</button>
                <button class="btn-secondary" id="generateWorldBtn">✨ LLM 生成</button>
                <button class="btn-primary" id="saveWorldBtn">保存世界观</button>
                <button class="btn-danger" id="deleteWorldBtn" hidden title="删除当前世界观（旗下有子数据时会被拒绝）">🗑️ 删除</button>
                <button class="btn-secondary" id="localizeNamesBtn"
                        title="把本世界含罗马音/英文的角色名（含存档里无角色卡的临时 NPC 拼音名）批量改为汉字名，并把存档引用迁移到角色卡 ID 或汉字名">
                    一键中文化改名
                </button>
            </div>
            <div class="llm-input" id="worldLlmInput" hidden>
                <textarea id="worldKeywords" rows="6" placeholder="输入关键词，如：蒸汽朋克 失落的魔法 钟表城" autocomplete="off"></textarea>
                <button type="button" class="btn-primary" id="confirmGenerateWorldBtn">生成</button>
            </div>
        </div>
    </section>

    <!-- 角色卡编辑器 -->
    <section class="tab-content" id="tab-character">
        <div class="editor-section">
            <h2>角色卡</h2>
            <div class="form-row">
                <label>已保存角色</label>
                <select id="charSelect">
                    <option value="">（新建）</option>
                </select>
            </div>
            <div class="form-row">
                <label>名称</label>
                <input type="text" id="charNameInput" placeholder="角色名称" autocomplete="off"/>
            </div>
            <div class="form-row">
                <label>身份</label>
                <input type="text" id="charIdentityInput" placeholder="如：流浪剑客" autocomplete="off"/>
            </div>
            <div class="form-row">
                <label>性格</label>
                <textarea id="charPersonalityInput" rows="10" placeholder="性格描述..." autocomplete="off"></textarea>
            </div>
            <div class="form-row">
                <label>背景</label>
                <textarea id="charBackgroundInput" rows="10" placeholder="背景故事..." autocomplete="off"></textarea>
            </div>
            <div class="form-row">
                <label>动机</label>
                <input type="text" id="charMotivationInput" placeholder="如：贪财、好奇" autocomplete="off"/>
            </div>
            <div class="form-row">
                <label>说话风格</label>
                <input type="text" id="charSpeechStyleInput" placeholder="如：粗犷" autocomplete="off"/>
            </div>
            <div class="form-actions">
                <button class="btn-secondary" id="newCharBtn" title="清空表单，准备新建角色">➕ 新建</button>
                <button class="btn-secondary" id="generateCharBtn">✨ LLM 生成</button>
                <button class="btn-primary" id="saveCharBtn">保存角色卡</button>
                <button class="btn-danger" id="deleteCharBtn" hidden title="删除当前角色（被关系/触发器/存档引用时会被拒绝）">🗑️ 删除</button>
            </div>
            <div class="llm-input" id="charLlmInput" hidden>
                <textarea id="charDesc" rows="6" placeholder="简述角色，如：盗贼，贪财，出身贫苦" autocomplete="off"></textarea>
                <button type="button" class="btn-primary" id="confirmGenerateCharBtn">生成</button>
            </div>
        </div>
    </section>

    <!-- 地点编辑器 -->
    <section class="tab-content" id="tab-location">
        <div class="editor-section">
            <h2>地点</h2>
            <div class="form-row">
                <label>名称</label>
                <input type="text" id="locNameInput" placeholder="如：客栈"/>
            </div>
            <div class="form-row">
                <label>描述</label>
                <textarea id="locDescInput" rows="10" placeholder="地点描述..."></textarea>
            </div>
            <div class="form-actions">
                <button class="btn-primary" id="saveLocBtn">保存地点</button>
            </div>
        </div>
    </section>

    <!-- 触发器编辑器 -->
    <section class="tab-content" id="tab-trigger">
        <div class="editor-section">
            <h2>触发器</h2>
            <div class="form-row">
                <label>类型</label>
                <select id="triggerType">
                    <option value="event">事件触发</option>
                    <option value="motivation">动机触发</option>
                </select>
            </div>
            <div class="form-row">
                <label>关联 NPC ID</label>
                <input type="text" id="triggerNpcId" placeholder="NPC 角色 ID"/>
            </div>
            <div class="form-row">
                <label>硬条件 (JSON)</label>
                <textarea id="triggerHardConditions" rows="10" placeholder='[{"field":"player.location","op":"==","value":"路上"}]'></textarea>
            </div>
            <div class="form-row">
                <label>软条件</label>
                <input type="text" id="triggerSoftCondition" placeholder="如：玩家最近行为表现出财富"/>
            </div>
            <div class="form-row">
                <label>行动</label>
                <input type="text" id="triggerAction" placeholder="如：rob"/>
            </div>
            <div class="form-row">
                <label>冷却轮次</label>
                <input type="number" id="triggerCooldown" value="3" min="0"/>
            </div>
            <div class="form-row">
                <label>触发概率</label>
                <input type="number" id="triggerProbability" value="0.6" step="0.1" min="0" max="1"/>
            </div>
            <div class="form-actions">
                <button class="btn-primary" id="saveTriggerBtn">保存触发器</button>
            </div>
        </div>
    </section>

    <!-- 关系编辑器 -->
    <section class="tab-content" id="tab-relationship">
        <div class="editor-section">
            <h2>关系</h2>
            <div class="form-row">
                <label>角色 A ID</label>
                <input type="text" id="relCharA" placeholder="角色 A"/>
            </div>
            <div class="form-row">
                <label>角色 B ID</label>
                <input type="text" id="relCharB" placeholder="角色 B"/>
            </div>
            <div class="form-row">
                <label>态度 (-100~100)</label>
                <input type="number" id="relAttitude" value="0" min="-100" max="100"/>
            </div>
            <div class="form-row">
                <label>信任 (0~100)</label>
                <input type="number" id="relTrust" value="50" min="0" max="100"/>
            </div>
            <div class="form-actions">
                <button class="btn-primary" id="saveRelBtn">保存关系</button>
            </div>
        </div>
    </section>

</main>

<!-- ========== 游戏模式 ========== -->
<main class="game-mode" id="gameMode" hidden>
    <!-- 叙述区域：追加式对话气泡列表（不覆盖历史） -->
    <div class="narration-area" id="narrationArea">
        <div class="rpg-messages" id="messagesContainer"></div>
    </div>

    <!-- 状态面板 -->
    <aside class="status-panel" id="statusPanel">
        <div class="status-header">状态</div>
        <div class="status-item"><label>位置</label><span id="statusLocation">-</span></div>
        <div class="status-item"><label>轮次</label><span id="statusTurn">0</span></div>
        <div class="status-item"><label>NPC</label><span id="statusNpcs">-</span></div>
        <!-- 全量花名册（rpg-scene-cast）：NPC 行只显示当前场景班底，此处折叠展示已结识的全部 NPC -->
        <details id="statusRoster" class="status-roster" hidden>
            <summary id="statusRosterSummary">已结识 (0)</summary>
            <span id="statusRosterList" class="status-roster-list"></span>
        </details>
        <div class="status-subheader">玩家</div>
        <div class="status-item"><label>金钱</label><span id="statusMoney">-</span></div>
        <div class="status-item"><label>称号</label><span id="statusTitles">-</span></div>
        <div class="status-item"><label>能力</label><span id="statusAbilities">-</span></div>
    </aside>

    <!-- 输入区域 -->
    <div class="input-area" id="inputArea" hidden>
        <!-- 上下文用量进度条（参考 chat.html，复用 /chat/context-info 计量） -->
        <div class="context-bar hidden" id="contextBar">
            <div class="context-bar-inner">
                <div class="context-bar-fill" id="contextBarFill"></div>
            </div>
            <span class="context-bar-text" id="contextBarText"></span>
        </div>
        <!-- 模型选择器（参考 chat.html 模型栏） -->
        <div class="model-bar">
            <label class="model-label" for="modelSelector">🤖 模型</label>
            <select class="model-selector" id="modelSelector" title="选择对话模型">
                <option value="">默认（云端）</option>
            </select>
            <button type="button" class="memory-mgr-btn" id="memoryMgrBtn"
                    title="管理当前存档的 GM 笔记本（增删改查）">📔 记忆管理</button>
        </div>
        <form id="gameForm" class="game-input-form">
            <input type="text" id="gameInput" placeholder="输入你的行动..." autocomplete="off"/>
            <button type="button" class="compact-btn" id="compactBtn" title="压缩上下文（归档较早剧情轮次）">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M4 14h6v6M20 10h-6V4M14 10l7-7M3 21l7-7" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>
            <button type="submit" class="btn-send" id="gameSendBtn">发送</button>
            <button type="button" class="btn-stop" id="gameStopBtn" hidden>中止</button>
        </form>
    </div>
</main>

<!-- ========== 存档记忆管理弹窗（当前存档的 GM 笔记本） ========== -->
<div class="load-overlay" id="memoryOverlay" hidden>
    <div class="load-dialog memory-dialog">
        <div class="memory-head">
            <h3>📔 记忆管理</h3>
            <span class="memory-scope" id="memoryScopeHint"></span>
            <button type="button" class="memory-close" id="closeMemoryBtn" title="关闭">✕</button>
        </div>
        <div class="memory-body">
            <div class="memory-list-pane">
                <div class="memory-toolbar">
                    <button type="button" class="btn-secondary" id="newMemoryBtn">＋ 新建</button>
                    <button type="button" class="btn-secondary" id="refreshMemoryBtn">刷新</button>
                </div>
                <div class="memory-groups" id="memoryGroups"></div>
            </div>
            <div class="memory-detail-pane">
                <div class="memory-hint" id="memoryHint">从左侧选一条记忆查看，或点「＋ 新建」。</div>
                <!-- 详情态 -->
                <div class="memory-detail" id="memoryDetail" hidden>
                    <div class="memory-meta" id="memoryMeta"></div>
                    <div class="memory-content" id="memoryContent"></div>
                    <div class="memory-actions">
                        <button type="button" class="btn-secondary" id="editMemoryBtn">编辑</button>
                        <button type="button" class="btn-danger" id="deleteMemoryBtn">删除</button>
                    </div>
                </div>
                <!-- 表单态（新建/编辑共用） -->
                <div class="memory-form" id="memoryForm" hidden>
                    <div class="form-row">
                        <label>文件名</label>
                        <input type="text" id="memFileInput" placeholder="如 npc_dong-lang.md"/>
                    </div>
                    <div class="form-row">
                        <label>名称</label>
                        <input type="text" id="memNameInput" placeholder="一行标题"/>
                    </div>
                    <div class="form-row">
                        <label>描述</label>
                        <input type="text" id="memDescInput" placeholder="一行描述（写入索引）"/>
                    </div>
                    <div class="form-row">
                        <label>类型</label>
                        <select id="memTypeInput">
                            <option value="npc_memory">npc_memory（NPC 长期记忆）</option>
                            <option value="foreshadow">foreshadow（伏笔）</option>
                            <option value="world_lore">world_lore（世界细节）</option>
                            <option value="player_style">player_style（玩家偏好）</option>
                        </select>
                    </div>
                    <div class="form-row">
                        <label>正文</label>
                        <textarea id="memContentInput" rows="10" placeholder="记忆正文..."></textarea>
                    </div>
                    <div class="memory-actions">
                        <button type="button" class="btn-primary" id="saveMemoryBtn">保存</button>
                        <button type="button" class="btn-secondary" id="cancelMemoryBtn">取消</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 删除二次确认（自包含于 rpg.css，不依赖 chat.css 的 .confirm-dialog） -->
<div class="load-overlay memory-confirm-overlay" id="memoryConfirmOverlay" hidden>
    <div class="load-dialog memory-confirm">
        <h3>🗑️ 删除记忆</h3>
        <p id="memoryConfirmText">确认删除这条记忆？此操作不可撤销。</p>
        <div class="memory-actions">
            <button type="button" class="btn-secondary" id="memoryConfirmNo">取消</button>
            <button type="button" class="btn-danger" id="memoryConfirmYes">删除</button>
        </div>
    </div>
</div>

<!-- Thymeleaf 注入 sessionId 到 JS 全局变量（RPG 会话由前端生成，此处为兜底注入位，缺省 null） -->
<script th:inline="javascript">
    window.__SESSION_ID__ = /*[[${sessionId}]]*/ null;
</script>
<!-- rpg-js-split：按依赖顺序加载，state.js 必须最先、init.js 必须最后 -->
<script th:src="@{/js/auth-redirect.js(v=${#dates.createNow().time})}"></script>
<script th:src="@{/js/rpg/state.js(v=${#dates.createNow().time})}"></script>
<script th:src="@{/js/rpg/markdown.js(v=${#dates.createNow().time})}"></script>
<script th:src="@{/js/rpg/messages.js(v=${#dates.createNow().time})}"></script>
<script th:src="@{/js/rpg/backtrack.js(v=${#dates.createNow().time})}"></script>
<script th:src="@{/js/rpg/workshop.js(v=${#dates.createNow().time})}"></script>
<script th:src="@{/js/rpg/game.js(v=${#dates.createNow().time})}"></script>
<script th:src="@{/js/rpg/saves.js(v=${#dates.createNow().time})}"></script>
<script th:src="@{/js/rpg/memory-dialog.js(v=${#dates.createNow().time})}"></script>
<script th:src="@{/js/rpg/init.js(v=${#dates.createNow().time})}"></script>
</body>
</html>
