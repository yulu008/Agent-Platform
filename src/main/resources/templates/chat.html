<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Agent Platform</title>
    <link rel="stylesheet" th:href="@{/css/chat.css(v=${#dates.createNow().time})}"/>
</head>
<body>

    <!-- 顶部标题栏 -->
    <header class="chat-header">
        <button class="header-btn drawer-toggle" id="drawerToggle" title="会话列表">☰</button>
        <h1>
            <span class="logo-dot"></span>
           Agent Platform
        </h1>
        <!-- 天气簇（JS 拉取成功后填充，默认隐藏） -->
        <div class="weather-cluster" id="weatherCluster" hidden></div>
        <!-- 天气动画 FX 层（被 header overflow:hidden 裁剪在标题栏内） -->
        <div class="header-weather-fx" aria-hidden="true">
            <div class="fx-rain fx-rain-1"></div>
            <div class="fx-rain fx-rain-2"></div>
            <div class="fx-rain fx-rain-3"></div>
            <div class="fx-snow"></div>
            <div class="fx-flash"></div>
        </div>
        <button class="header-btn memory-toggle" id="memoryToggle" title="长期记忆">📝</button>
        <a href="/rpg" class="header-btn rpg-link" title="RPG 首页">🎲</a>
    </header>

    <!-- 左侧会话抽屉 -->
    <aside class="session-drawer" id="sessionDrawer">
        <div class="drawer-header">
            <span class="drawer-title">☁️ 会话列表</span>
            <button class="drawer-close" id="drawerClose">✕</button>
        </div>
        <button class="new-session-btn" id="newSessionBtn">+ 新对话</button>
        <ul class="session-list" id="sessionList">
            <!-- 会话列表由 JS 动态渲染 -->
        </ul>
    </aside>
    <!-- 抽屉遮罩 -->
    <div class="drawer-overlay" id="drawerOverlay"></div>

    <!-- 右侧记忆抽屉 -->
    <aside class="memory-drawer" id="memoryDrawer">
        <div class="drawer-header">
            <span class="drawer-title">📝 长期记忆</span>
            <button class="drawer-close" id="memoryDrawerClose">✕</button>
        </div>
        <div class="memory-list" id="memoryList">
            <!-- 记忆列表由 JS 动态渲染 -->
        </div>
        <button class="memory-manage-btn" id="memoryManageBtn">完整管理 →</button>
    </aside>
    <!-- 记忆抽屉遮罩 -->
    <div class="drawer-overlay memory-overlay" id="memoryOverlay"></div>

    <!-- 消息区域 -->
    <main class="chat-messages" id="messagesContainer">
        <!-- 欢迎信息或历史消息将由 JS 动态插入 -->
    </main>

    <!-- "/" 命令面板 -->
    <div class="command-palette hidden" id="commandPalette"></div>

    <!-- 输入区域 -->
    <footer class="chat-input-area">
        <!-- 上下文进度条 -->
        <div class="context-bar" id="contextBar">
            <div class="context-bar-inner">
                <div class="context-bar-fill" id="contextBarFill"></div>
            </div>
            <span class="context-bar-text" id="contextBarText"></span>
        </div>
        <div class="model-bar">
            <label class="model-label" for="modelSelector">🤖 模型</label>
            <select class="model-selector" id="modelSelector" title="选择对话模型">
                <option value="">默认（云端）</option>
            </select>
        </div>
        <form class="chat-input-wrapper" id="chatForm">
            <span class="skill-icon" id="skillIcon">🔧</span>
            <div class="image-preview" id="imagePreview">
                <img src="" alt="" id="imagePreviewImg">
                <button type="button" class="remove-image-btn" id="removeImageBtn">×</button>
            </div>
            <textarea
                class="chat-input"
                id="chatInput"
                placeholder="输入消息，Enter 发送，Shift+Enter 换行..."
                rows="1"
                autocomplete="off"></textarea>
            <button type="button" class="clear-session-btn" id="clearSessionBtn" title="清空当前会话">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6h14" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>
            <button type="button" class="compact-btn" id="compactBtn" title="压缩上下文">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M4 14h6v6M20 10h-6V4M14 10l7-7M3 21l7-7" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>
            <button type="submit" class="send-btn" id="sendBtn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M22 2L11 13M22 2L15 22L11 13L2 9L22 2Z" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>
        </form>
    </footer>

    <!-- Thymeleaf 注入 sessionId 到 JS 全局变量 -->
    <script th:inline="javascript">
        window.__SESSION_ID__ = /*[[${sessionId}]]*/ null;
    </script>
    <!-- Markdown 渲染库（本地 vendor，离线可用） -->
    <script th:src="@{/vendor/marked.min.js(v=${#dates.createNow().time})}"></script>
    <script th:src="@{/vendor/purify.min.js(v=${#dates.createNow().time})}"></script>
    <script th:src="@{/js/auth-redirect.js(v=${#dates.createNow().time})}"></script>
    <script th:src="@{/js/chat.js(v=${#dates.createNow().time})}"></script>
</body>
</html>
